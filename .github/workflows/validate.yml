# Echo CI: validate every push and PR with each language's own tools.
#
# Echo is a two-language repository (ADR-0001): Go owns the CLI at the repo
# root, Python owns the GPU worker under worker/. Each language gets its own
# job so a failure names which side broke.
#
# No GPU is required and no model is ever downloaded. GPU transcription is
# verified by the manual smoke test documented for Milestone 7, never here.
name: validate

on:
  push:
    branches: [main, master]
  pull_request:

# Superseded runs on the same branch are pointless once a newer commit exists.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: go (CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # A formatting drift is a one-command fix, so say which files and how.
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files need gofmt. Run: gofmt -w ."
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # -race catches data races that a plain run hides; the worker subprocess
      # integration in Milestone 5 will be concurrent.
      - name: go test
        run: go test -race ./...

      # The primary target is Windows, but CI runs on Linux. Compiling for
      # windows/amd64 keeps a platform-specific break from reaching a release.
      - name: cross-compile for Windows
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build ./...

  worker:
    name: worker (GPU inference)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: worker/uv.lock

      # --locked fails rather than silently resolving different versions, so a
      # stale uv.lock is caught here instead of on a contributor's machine.
      - name: uv sync
        run: uv sync --locked

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format
        run: uv run ruff format --check .

      - name: pytest
        run: uv run pytest
